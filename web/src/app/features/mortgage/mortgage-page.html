<div class="flex min-h-screen flex-col bg-base-100">
  <header class="bg-base-100 shadow-sm">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <a routerLink="/" aria-label="ALHECASA, inicio">
        <app-logo />
      </a>
      @if (!auth.isAuthenticated()) {
        <div class="flex items-center gap-2">
          <a routerLink="/registro" class="btn btn-outline btn-primary btn-sm sm:btn-md">Publica gratis</a>
          <a routerLink="/login" class="btn btn-primary btn-sm sm:btn-md">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
            Iniciar sesión
          </a>
        </div>
      }
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 space-y-6 px-4 py-6 sm:px-6">
    <a routerLink="/" class="btn btn-ghost btn-sm">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      Volver a las propiedades
    </a>

    <div class="space-y-1">
      <h1 class="text-3xl font-extrabold leading-tight">Calculadora hipotecaria</h1>
      <p class="text-base-content/70">
        Calcula tu mensualidad, lo que pagas en total y cuánto necesitas para empezar. O, al revés, cuánto crédito te alcanza con tu ingreso.
      </p>
    </div>

    <app-mortgage-calculator [price]="preload().price" [currency]="preload().currency" />
  </main>
</div>
